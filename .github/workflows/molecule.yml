---
name: Ansible Molecule
on: [push, pull_request]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-22.04 # ubuntu latest will for all RHEL-based distros: https://github.com/rocky-linux/sig-cloud-instance-images/issues/56
    container:
      image: python:3.9
    strategy:
      fail-fast: false
      matrix:
        config:
          - image: "debian13"
          - image: "fedora43"
          - image: "ubuntu2404"
          - image: "rockylinux9"
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: "${{ github.repository }}"
          persist-credentials: false

      - name: molecule
        uses: gofrolist/molecule-action@9eb6dac7c5fc6dc05ccfe2fe8b01e06628513646 # v2.7.93
        with:
          molecule_working_dir: "${{ github.repository }}/extensions"
        env:
          image: ${{ matrix.config.image }}
